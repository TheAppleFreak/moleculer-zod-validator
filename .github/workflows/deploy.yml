name: Deploy

on:
  release:
    types: [ published ]

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@^11.17.0
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish